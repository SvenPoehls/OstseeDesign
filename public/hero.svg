<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLATZHALTER-HINTERGRUNDBILD für den Kopfbereich der Startseite.

  Das ist absichtlich kein Foto, sondern eine ruhige, dunkle Grafik – sie dient
  nur als Stellvertreter, bis ein echtes Bild vorliegt. Darüber liegt auf der
  Website ein dunkler Schleier, damit die weiße Schrift gut lesbar bleibt.

  ECHTES BILD EINSETZEN (ohne Code-Kenntnisse):
    1. Foto als "hero.jpg" in diesen Ordner (public) legen – quer, mindestens
       1600 Pixel breit. Gut geeignet: Werkstatt, Stickmaschine, ein frisch
       beschriftetes Fahrzeug.
    2. In der Datei src/components/sections/Hero.tsx die Zeile
         const hintergrundBild = "/hero.svg";
       ändern in
         const hintergrundBild = "/hero.jpg";
  Mehr ist nicht nötig; der dunkle Schleier bleibt automatisch bestehen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3b424d"/>
      <stop offset="1" stop-color="#21262e"/>
    </linearGradient>
    <linearGradient id="platteHell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d95a2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b626d" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="platteDunkel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b21" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2b313a" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="licht" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="raster" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Grundfläche + feines Raster -->
  <rect width="1600" height="900" fill="url(#grund)"/>
  <rect width="1600" height="900" fill="url(#raster)"/>

  <!-- Angedeutete Materialplatten, leicht gedreht übereinander gelegt -->
  <g transform="rotate(-9 800 450)">
    <rect x="-140" y="520" width="940" height="300" rx="18" fill="url(#platteHell)"/>
    <rect x="620" y="620" width="1200" height="320" rx="18" fill="url(#platteDunkel)"/>
    <rect x="180" y="430" width="760" height="140" rx="14" fill="#ffffff" opacity="0.08"/>
  </g>
  <g transform="rotate(6 800 450)">
    <rect x="980" y="110" width="780" height="220" rx="18" fill="url(#platteHell)"/>
    <rect x="-220" y="40" width="640" height="190" rx="16" fill="#ffffff" opacity="0.06"/>
  </g>

  <!-- Weiches Licht in der Mitte, damit die Schrift darüber ruhig steht -->
  <rect width="1600" height="900" fill="url(#licht)"/>
</svg>
