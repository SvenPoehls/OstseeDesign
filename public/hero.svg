<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLATZHALTER-BILD für das breite Bildband im Kopfbereich.

  Absichtlich kein Foto, sondern eine ruhige Papier-Grafik in den Farben der
  Seite – sie hält nur den Platz frei, bis ein echtes Bild vorliegt.

  ECHTES BILD EINSETZEN (ohne Code-Kenntnisse):
    1. Foto als "hero.jpg" in diesen Ordner (public) legen – quer, mindestens
       1600 Pixel breit. Gut geeignet: Werkstatt, Stickmaschine, ein frisch
       beschriftetes Fahrzeug, die Fassade am Rosseer Weg.
    2. In src/components/sections/Hero.tsx die Zeile
         const bildDatei = "/hero.svg";
       ändern in
         const bildDatei = "/hero.jpg";
  Mehr ist nicht nötig.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600"
     preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#eae5d8"/>
      <stop offset="1" stop-color="#ddd7c7"/>
    </linearGradient>
    <pattern id="schraffur" width="14" height="14" patternUnits="userSpaceOnUse"
             patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#14130f" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Grundfläche mit feiner Schraffur, wie getöntes Papier -->
  <rect width="1600" height="600" fill="url(#grund)"/>
  <rect width="1600" height="600" fill="url(#schraffur)"/>

  <!-- Angedeutete Flächen: ein Schild, eine Bahn Folie, ein Stapel Stoff -->
  <g fill="none" stroke="#14130f" stroke-opacity="0.3">
    <rect x="120" y="120" width="420" height="300" stroke-width="2"/>
    <line x1="120" y1="190" x2="540" y2="190" stroke-width="1"/>
    <path d="M700 420 L980 120 L1270 120 L990 420 Z" stroke-width="2"/>
    <path d="M760 420 L1040 120" stroke-width="1"/>
    <path d="M820 420 L1100 120" stroke-width="1"/>
    <rect x="1180" y="300" width="300" height="40" stroke-width="2"/>
    <rect x="1180" y="350" width="300" height="40" stroke-width="2"/>
    <rect x="1180" y="400" width="300" height="40" stroke-width="2"/>
  </g>

  <!-- Maßhilfslinien oben, wie auf einer Montagezeichnung -->
  <g stroke="#14130f" stroke-opacity="0.22" stroke-width="1">
    <line x1="120" y1="60" x2="1480" y2="60"/>
    <line x1="120" y1="48" x2="120" y2="72"/>
    <line x1="800" y1="48" x2="800" y2="72"/>
    <line x1="1480" y1="48" x2="1480" y2="72"/>
  </g>
</svg>
